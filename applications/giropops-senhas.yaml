apiVersion: argoproj.io/v1alpha1
Kind: Application
metadata:
  name: giropops-senhas
  namespace: argocd
spec:
  project: 'default'
  source:
    helm: {}
    repoURL: 'https://github.com/daniloalbu/descomplicando-gitops-no-kubernetes-argocd.git'
    targetRevision: feat/day2
    path: giropops-senhas/helm
  destination:
    namespace: giropops-senhas
    server: 'https://kubernets.default.svc'
  syncPolicy:
    automated: {}
